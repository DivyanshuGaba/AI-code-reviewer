id: userdb
description: A user store with SQL injection, a timing leak and a weak session token.
bugs:
  - id: sql-injection
    file: users.py
    old: 'return conn.execute("SELECT id, name FROM users WHERE name = ?", (name,)).fetchone()'
    new: "return conn.execute(f\"SELECT id, name FROM users WHERE name = '{name}'\").fetchone()"
    category: security
    severity: critical
    title: User name is interpolated into SQL (injection)
    tests_detect: true
  - id: timing
    file: users.py
    old: "return hmac.compare_digest(hash_password(password, salt), stored)"
    new: "return hash_password(password, salt) == stored"
    category: security
    severity: low
    title: Password hashes compared with == (timing side channel)
    tests_detect: false
    relevant: ["users.py::hash_password"]
  - id: short-token
    file: users.py
    old: "return secrets.token_urlsafe(32)"
    new: "return secrets.token_urlsafe(4)"
    category: security
    severity: high
    title: Session token has too little entropy
    tests_detect: true

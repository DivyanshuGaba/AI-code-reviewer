[project]
name = "reviewer"
version = "0.1.0"
description = "AI code review tool: finds problems, explains them, and proposes sandbox-verified fixes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bandit>=1.7",
    "ruff>=0.5",
    "anthropic>=1.0",
    "pyyaml>=6.0",
    "chromadb>=1.0",
    "pydantic>=2.7",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.0", "types-PyYAML"]

[project.scripts]
reviewer = "reviewer.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reviewer*"]

[tool.setuptools.package-data]
reviewer = ["config/settings.yaml", "config/prompts/*.md", "config/semgrep/*.yaml", "verify/*.Dockerfile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".venv"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"reviewer/report/render_html.py" = ["E501"]  # long HTML string literals

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["reviewer"]

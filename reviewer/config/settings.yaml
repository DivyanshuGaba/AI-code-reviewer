# Pipeline settings. Bump config_version whenever behaviour-affecting values change;
# it is recorded on every run so results stay comparable.
config_version: "4"

provider: anthropic   # anthropic | ollama (local models; see README)

languages: [python]   # also: javascript, typescript (experimental; see README)

models:
  triage: claude-haiku-5-5       # cheap, high recall
  deep_review: claude-sonnet-5-5 # stronger, precision-oriented
  fixgen: claude-sonnet-5-5
  summary: claude-haiku-5-5       # one-sentence module summaries
  repo_level: claude-sonnet-5-5   # architecture pass

effort:
  triage: low
  deep_review: high
  fixgen: medium
  summary: low
  repo_level: high

prompts:
  triage: v1
  deep_review: v2
  fixgen: v1
  module_summary: v1
  repo_level: v1

max_tokens:
  triage: 2048
  deep_review: 8192
  fixgen: 4096
  summary: 400
  repo_level: 4096

retrieval:
  token_budget: 6000

signals:
  tools: [ruff, bandit, semgrep]   # static hints; a missing tool is skipped, not an error

review:
  triage_threshold: 0.3     # deep-review a chunk if needs_review or suspicion >= this
  escalate_min_severity: medium  # a static signal this severe forces a deep review
  min_confidence: 0.6       # precision over volume: drop findings below this
  max_findings_per_chunk: 5
  max_cost_usd: 2.0         # hard stop for one run

fix:
  min_severity: medium      # only findings at least this severe get a fix attempt
  max_changed_lines: 40     # reject larger diffs: fixes must stay minimal
  max_fixes: 10             # per run

repo_level:
  min_modules: 3            # skip the architecture pass for tiny repos
  max_modules: 150          # summarise and show at most this many modules (most connected first)
  max_findings: 5

# Used when provider is "ollama". Model names are examples: use whatever you have pulled.
ollama:
  host: http://localhost:11434   # OLLAMA_HOST overrides when this is left at the default
  num_ctx: 16384                  # context window; Ollama's own default would truncate prompts
  models:
    triage: qwen2.5-coder:7b
    deep_review: qwen2.5-coder:14b
    fixgen: qwen2.5-coder:14b
    summary: qwen2.5-coder:7b
    repo_level: qwen2.5-coder:14b
